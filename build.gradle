plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.cabine.momo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cabine.momo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Application 100% native : aucune dépendance WebView n'est nécessaire.
}
